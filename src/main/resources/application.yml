spring:
  application:
    name: task-manager-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskmanager}}
    username: ${DB_USER:taskmanager}
    password: ${DB_PASSWORD:taskmanager}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.lob.non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  docker:
    compose:
      enabled: false

server:
  port: ${PORT:${SERVER_PORT:8080}}

# Expose public health and authenticated Prometheus metrics only.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # Do not disclose component details without authentication.
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# OpenAPI documentation
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method   # Group endpoints by HTTP verb in the UI
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

# JWT configuration
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldmVsb3BtZW50LWp3dC1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1wbGVhc2U=}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days
    # iss/aud claims: defense-in-depth. Even in a single-service API, if
    # another service ever shares this signing key its tokens would be valid
    # here unless the audience is checked.
    issuer: ${JWT_ISSUER:task-manager-api}
    audience: ${JWT_AUDIENCE:task-manager-api-users}
  cors:
    # Origins allowed to make credentialed (cookie/Auth header) browser requests.
    # Dev default covers the typical Vite/React dev server. In prod, override
    # via CORS_ALLOWED_ORIGINS (see application-prod.yml).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    # In-memory token-bucket rate limiting for the auth endpoints (login +
    # refresh). Per source-IP, single shared bucket. Defaults allow a 10-request
    # burst, refilling 10 tokens every 60s (i.e. sustain ~10/min). State lives
    # in-process and resets on restart (see DECISIONS.md #15).
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS:10}
      refill-period-seconds: ${RATE_LIMIT_AUTH_REFILL_PERIOD_SECONDS:60}
      # Bucket-store eviction. Caps the per-IP map so a client spoofing
      # X-Forwarded-For with many distinct values cannot exhaust the heap.
      bucket-max-size: ${RATE_LIMIT_AUTH_BUCKET_MAX_SIZE:100000}
      # Idle buckets (no traffic from that IP) are dropped after this long.
      bucket-expire-after-access-minutes: ${RATE_LIMIT_AUTH_BUCKET_EXPIRE_MINUTES:60}
  # Trust the X-Forwarded-For header to identify the real client IP. Only
  # enable when the app runs behind a reverse proxy that OVERWRITES (not
  # appends to) this header — otherwise a client can spoof it to dodge the
  # per-IP limit. Default false = use the raw socket remote address.
  trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}

logging:
  level:
    com.renan.taskmanager: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
