name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'codex/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests, architecture and coverage gates
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: ./mvnw -B -ntp clean verify

      - name: Run scoped mutation gate
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: >
          ./mvnw -B -ntp -Ppit test-compile
          org.pitest:pitest-maven:mutationCoverage
          -DtargetClasses=com.renan.taskmanager.*.domain.*,com.renan.taskmanager.users.application.LoginUseCase,com.renan.taskmanager.users.application.RegisterUserUseCase,com.renan.taskmanager.users.application.RefreshTokenUseCase,com.renan.taskmanager.users.application.LogoutUseCase
          -DtargetTests=com.renan.taskmanager.*.domain.*,com.renan.taskmanager.users.*
          -DmutationThreshold=80

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test results
          path: target/(surefire|failsafe)-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            target/site/jacoco/
            target/pit-reports/
          retention-days: 7

  publish:
    name: Publish image
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
